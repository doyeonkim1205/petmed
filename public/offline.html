<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawDex - 오프라인</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #374151;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: #2563eb;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .logo svg { width: 20px; height: 20px; flex-shrink: 0; }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 360px;
    }
    .illustration {
      width: 200px;
      height: 200px;
      margin: 0 auto 1.5rem;
    }
    .illustration img { width: 100%; height: 100%; object-fit: contain; }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #111827;
    }
    p {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.65rem 1.5rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .retry-btn:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="30 32 64 58" fill="currentColor" style="color:#1e40af">
        <g transform="translate(0 13.5)">
          <path d="M40 37.5L38 37.5 34.5 33 34.5 30 37 27.5 39 27.5 42.5 31 42.5 35Z"/>
          <path d="M47 30.5L44 30.5 40.5 26 41.5 23 44 20.5 47 21.5 48.5 24 48.5 29Z"/>
          <path d="M55 30.5L51 30.5 49.5 29 49.5 24 54 20.5 56.5 22 57.5 24 57.5 27Z"/>
          <path d="M59 38.5L55.5 36 55.5 31 58 28.5 62 28.5 63.5 31 63.5 34 61.5 37Z"/>
          <path d="M57 47.5L51 47.5 50 46.5 41 47.5 38.5 46 38.5 40 42 37.5 46 32.5 50 31.5 53.5 34 54.5 37 57.5 39 59.5 43Z"/>
          <path d="M66 64.5L63 63.5 60.5 60 60.5 57 62 54.5 67 55.5 68.5 58 68.5 62Z"/>
          <path d="M72 57.5L70 57.5 66.5 53 66.5 51 69 47.5 72 47.5 74.5 51 74.5 55Z"/>
          <path d="M80 57.5L77 57.5 75.5 55 75.5 51 77 48.5 79 47.5 81 47.5 83.5 51 82.5 55Z"/>
          <path d="M86 64.5L81.5 63 81.5 58 85 54.5 87 54.5 89.5 57 89.5 60Z"/>
          <path d="M83 74.5L78 74.5 77 73.5 71 73.5 69 74.5 66 73.5 64.5 72 64.5 67 69.5 63 72 59.5 76 58.5 79.5 61 85.5 69 85.5 71Z"/>
        </g>
      </svg>
      PawDex
    </div>
  </div>

  <div class="container">
    <div class="illustration">
      <img src="/icons/offline-illustration.svg" alt="네트워크 오류" onerror="this.style.display='none'">
    </div>
    <h1>네트워크 연결이 원활하지 않아요.</h1>
    <p>인터넷 연결 상태를 확인한 후<br>다시 시도해 주세요.</p>
    <p style="font-size:0.75rem;color:#9ca3af;margin-bottom:1.5rem">연결 후에도 화면이 이상하면 앱을 재실행해 주세요.</p>
    <button class="retry-btn" onclick="location.replace(window.location.origin + '/')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      다시 시도
    </button>
  </div>

  <script>
    // 네트워크 복귀 시 자동 새로고침
    window.addEventListener('online', function() {
      location.replace(window.location.origin + '/');
    });
  </script>
</body>
</html>
