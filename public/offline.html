<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawDex - 오프라인</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #374151;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: #2563eb;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .logo svg { width: 20px; height: 20px; }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 360px;
    }
    .illustration {
      width: 200px;
      height: 200px;
      margin: 0 auto 1.5rem;
    }
    .illustration img { width: 100%; height: 100%; object-fit: contain; }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #111827;
    }
    p {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.65rem 1.5rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .retry-btn:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor" style="color:#1e40af">
        <ellipse cx="7.5" cy="7" rx="2.5" ry="3"/>
        <ellipse cx="16.5" cy="7" rx="2.5" ry="3"/>
        <ellipse cx="4" cy="13" rx="2" ry="2.5"/>
        <ellipse cx="20" cy="13" rx="2" ry="2.5"/>
        <ellipse cx="12" cy="16" rx="5" ry="4.5"/>
      </svg>
      PawDex
    </div>
  </div>

  <div class="container">
    <div class="illustration">
      <img src="/icons/offline-illustration.svg" alt="네트워크 오류" onerror="this.style.display='none'">
    </div>
    <h1>네트워크 연결이 원활하지 않아요.</h1>
    <p>인터넷 연결 상태를 확인한 후<br>다시 시도해 주세요.</p>
    <button class="retry-btn" onclick="location.reload()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      다시 시도
    </button>
  </div>

  <script>
    // 네트워크 복귀 시 자동 새로고침
    window.addEventListener('online', function() {
      location.reload();
    });
  </script>
</body>
</html>
