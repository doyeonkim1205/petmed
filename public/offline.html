<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawDex - 오프라인</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #374151;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #111827;
    }
    p {
      font-size: 0.95rem;
      color: #6b7280;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .retry-btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
    }
    .retry-btn:active { background: #1d4ed8; }
    .logo { font-size: 1.25rem; font-weight: 700; color: #2563eb; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">PawDex</div>
    <div class="icon">&#128246;</div>
    <h1>오프라인 상태입니다</h1>
    <p>인터넷 연결을 확인한 후 다시 시도해 주세요.</p>
    <button class="retry-btn" onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
