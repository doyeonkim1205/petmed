<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>*{margin:0;padding:0}html,body,#map{width:100%;height:100%;overflow:hidden}</style>
</head><body>
<div id="map"></div>
<script>
var params=new URLSearchParams(location.search);
var initLat=parseFloat(params.get('lat'))||37.5665;
var initLng=parseFloat(params.get('lng'))||126.978;
var map,markers=[],overlays=[],skipDrag=false;
function sm(d){if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify(d))}
</script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e16f400e9313a8a880c3c43ad0a3003a&autoload=false"></script>
<script>
if(typeof kakao!=='undefined'&&kakao.maps){
  kakao.maps.load(function(){
    map=new kakao.maps.Map(document.getElementById('map'),{
      center:new kakao.maps.LatLng(initLat,initLng),level:5
    });
    kakao.maps.event.addListener(map,'dragend',function(){
      if(skipDrag){skipDrag=false;return}
      var c=map.getCenter();
      sm({type:'dragEnd',lat:c.getLat(),lng:c.getLng()});
    });
    sm({type:'ready'});
  });
} else {
  sm({type:'error',msg:'SDK load failed'});
}
function clearAll(){
  for(var i=0;i<markers.length;i++)markers[i].setMap(null);
  for(var i=0;i<overlays.length;i++)overlays[i].setMap(null);
  markers=[];overlays=[];
}
function addMarkers(list){
  clearAll();
  for(var i=0;i<list.length;i++){
    var h=list[i];
    var pos=new kakao.maps.LatLng(h.lat,h.lng);
    var marker=new kakao.maps.Marker({position:pos,map:map});
    var lbl='<div style="padding:2px 8px;background:'+(h.is24h?'#EF4444':'#3B82F6')+
      ';color:#fff;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;'+
      'transform:translateY(-8px);box-shadow:0 2px 4px rgba(0,0,0,.2);">'+
      (h.is24h?'24\uC2DC':'H')+'</div>';
    var ov=new kakao.maps.CustomOverlay({content:lbl,position:pos,yAnchor:2.5,map:map});
    (function(id){
      kakao.maps.event.addListener(marker,'click',function(){sm({type:'markerClick',id:id})});
    })(h.id);
    markers.push(marker);overlays.push(ov);
  }
}
function panTo(lat,lng){
  if(!map)return;skipDrag=true;
  map.panTo(new kakao.maps.LatLng(lat,lng));map.setLevel(3);
}
function setCenter(lat,lng,lv){
  if(!map)return;skipDrag=true;
  map.setCenter(new kakao.maps.LatLng(lat,lng));
  if(lv)map.setLevel(lv);
}
document.addEventListener('message',function(e){
  try{var m=JSON.parse(e.data);
    if(m.type==='addMarkers')addMarkers(m.list);
    else if(m.type==='panTo')panTo(m.lat,m.lng);
    else if(m.type==='setCenter')setCenter(m.lat,m.lng,m.level);
  }catch(x){}
});
window.addEventListener('message',function(e){
  try{var m=JSON.parse(e.data);
    if(m.type==='addMarkers')addMarkers(m.list);
    else if(m.type==='panTo')panTo(m.lat,m.lng);
    else if(m.type==='setCenter')setCenter(m.lat,m.lng,m.level);
  }catch(x){}
});
</script>
</body></html>
